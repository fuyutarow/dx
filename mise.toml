[tools]
bun = "1.4.3"

[tasks.setup]
alias = "i"
run = "bun install --frozen-lockfile"

[tasks.fmt]
alias = "f"
run = "bun run node_modules/oxfmt/bin/oxfmt src scripts tests .dx-preset package.json tsconfig.json .oxlintrc.json .oxfmtrc.json"

[tasks."fmt:check"]
run = "bun run node_modules/oxfmt/bin/oxfmt --check src scripts tests .dx-preset package.json tsconfig.json .oxlintrc.json .oxfmtrc.json"

[tasks."fmt:staged"]
run = "fmt-staged --tool 'ts=bun {{config_root}}/node_modules/oxfmt/bin/oxfmt'"

[tasks.lint]
alias = "l"
depends = ["lint:ts:all"]

[tasks."lint:ts"]
description = "Check every local TypeScript file with the copied type-aware preset"
run = "bun .dx-preset/lint-oxlint.ts --type-aware src scripts tests .dx-preset"

[tasks."lint:ts:all"]
depends = ["lint:ts"]

[tasks.typecheck]
run = "bun check && bun check scripts"

[tasks."release:build"]
description = "Build standalone Linux x64 and macOS arm64 release archives"
run = "bun scripts/release-build.ts"

[tasks.test]
alias = "t"
run = "bun test tests"

[tasks.up]
alias = "u"
run = "bun update"

[tasks.check]
alias = "c"
depends = ["fmt:check", "lint", "typecheck", "test"]

[tasks."mise:contract"]
run = "mise-contract"

[tasks."hook:pre-commit"]
depends = ["fmt:staged", "lint", "typecheck", "test"]

[tasks.commit]
run = "jj-commit"

[tasks.pull]
run = "jj git fetch --remote origin && jj rebase -b @ -d 'trunk()'"

[tasks.push]
run = "jj-push"
